[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ado-pipeline-graph"
version = "0.1.0"
description = "Render Azure DevOps pipeline YAML and relationships as Mermaid graphs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Robby" }]
keywords = ["azure-devops", "azure-pipelines", "mermaid", "yaml", "graph", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.17.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "build>=1.0",
    "twine>=5.0",
]
# Alias kept so existing `pip install -e '.[test]'` instructions keep working.
test = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Repository = "https://github.com/rbby/azdo-graph"
Issues = "https://github.com/rbby/azdo-graph/issues"

[project.scripts]
ado-pipeline-graph = "ado_pipeline_graph.cli:main"

[tool.setuptools.packages.find]
include = ["ado_pipeline_graph*"]

[tool.setuptools.package-data]
ado_pipeline_graph = ["py.typed", "skill/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ado_pipeline_graph"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
